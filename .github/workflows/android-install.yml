name: Android 15 APK installation
on:
  push:
    paths: ['.github/workflows/android-install.yml']
  workflow_dispatch:
    inputs:
      version:
        description: APK version to verify
        default: '1.0.2'
        required: true
permissions:
  contents: read
jobs:
  install:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Download signed APK
        env:
          VERSION: ${{ inputs.version || '1.0.2' }}
        run: |
          curl --fail --location --retry 3 -o pepper.apk "https://github.com/zannetabapinaeva-wq/treker-perets/releases/download/v$VERSION/pepper-course-$VERSION.apk"
          echo '43ddc5c5ef3b457a7f213f9dc1347bee7a62d4988cdd262e94253d39a5a008d1  pepper.apk' | sha256sum -c -
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Install and launch on Android 15
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: default
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          script: |
            adb install -r pepper.apk
            adb shell am start -W -n ru.peppercourse.app/.MainActivity
            sleep 25
            adb shell pidof ru.peppercourse.app
            adb shell dumpsys webviewupdate
            adb logcat -d | grep -E 'chromium|CONSOLE|AndroidRuntime|WebView' || true
            adb shell uiautomator dump /sdcard/window.xml
            adb pull /sdcard/window.xml android15.xml
            adb exec-out screencap -p > android15.png
      - name: Save Android 15 screen
        uses: actions/upload-artifact@v4
        with:
          name: android15-screen
          path: |
            android15.png
            android15.xml
